<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestauManager</title>
    <style>
      #loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #F5F5F4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #E7E5E4;
        border-top: 4px solid #7C2D12;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loader-title {
        font-size: 20px;
        font-weight: 600;
        color: #1C1917;
        margin-bottom: 8px;
      }
      .loader-text {
        font-size: 13px;
        color: #78716C;
        text-align: center;
        max-width: 260px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      <div class="loader-title">🍽 RestauManager</div>
      <div class="loader-text">Démarrage du serveur en cours, veuillez patienter...</div>
    </div>
    <div id="root" style="display:none"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
